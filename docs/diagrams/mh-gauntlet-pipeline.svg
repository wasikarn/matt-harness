<?xml version="1.0" encoding="UTF-8"?>
  <svg class="diagram" viewBox="0 0 1120 720" role="img" aria-labelledby="mh-gauntlet-title mh-gauntlet-desc" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><style type="text/css"><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');]]></style></defs>
    <title id="mh-gauntlet-title">mh@wasikarn gauntlet pipeline: one trigger fans out to six parallel verification layers that merge strictest-wins.</title>
    <desc id="mh-gauntlet-desc">Process diagram. A trigger node (pre-commit hook for fast checks, pre-push for full gauntlet) forks into six parallel verification layers stacked vertically: plugin-validate, shell-lint, json-lint, harness-audit, path-hygiene, hook-tests. Each layer writes its own log. A merge funnel collects verdicts via wait_layer; any single failure sets fail=1 and the action is blocked. Two endpoints: proceed (right, white) or block (left, coral focal).</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="1120" height="720" fill="#f5f5f5"/>

    <!-- ===== ARROWS (drawn first, behind nodes) ===== -->
    <!-- Trigger → fanout (right then down) -->
    <path d="M 240 96 L 290 96 L 290 196" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Fanout → 6 layer boxes (horizontal arrows to box left edge) -->
    <path d="M 290 196 L 400 132" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 290 196 L 400 200" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 290 196 L 400 268" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 290 196 L 400 336" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 290 196 L 400 404" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 290 196 L 400 472" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Each layer → merge funnel (right then down to funnel line at x=720, then to merge dot) -->
    <path d="M 660 132 L 720 132 L 720 540" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 660 200 L 720 200 L 720 540" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
    <path d="M 660 268 L 720 268 L 720 540" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
    <path d="M 660 336 L 720 336 L 720 540" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
    <path d="M 660 404 L 720 404 L 720 540" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
    <path d="M 660 472 L 720 472 L 720 540" stroke="#4f5d75" stroke-width="1.2" fill="none"/>

    <!-- Each layer → its log file (small dashed offshoot to right of each box) -->
    <path d="M 660 116 L 1080 116" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>
    <path d="M 660 184 L 1080 184" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>
    <path d="M 660 252 L 1080 252" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>
    <path d="M 660 320 L 1080 320" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>
    <path d="M 660 388 L 1080 388" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>
    <path d="M 660 456 L 1080 456" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3" fill="none"/>

    <!-- Merge funnel → endpoints -->
    <path d="M 720 556 L 720 596 L 880 596" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 720 556 L 720 612 L 290 612 L 290 644" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>

    <!-- "ALL" annotation on proceed branch -->
    <rect x="804" y="584" width="32" height="12" rx="2" fill="#f5f5f5"/>
    <text x="820" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALL</text>

    <!-- "ANY" annotation on coral branch -->
    <rect x="500" y="600" width="32" height="12" rx="2" fill="#f5f5f5"/>
    <text x="516" y="609" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ANY</text>

    <!-- ===== TRIGGER NODE (oval, top-left) ===== -->
    <rect x="60" y="72" width="180" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="150" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git push (or commit)</text>

    <!-- Editorial aside (right of trigger) -->
    <g font-family="'Instrument Serif', serif" font-style="italic" fill="rgba(45,49,66,0.65)">
      <text x="260" y="86" font-size="13">"Pre-commit runs the fast gate.</text>
      <text x="260" y="104" font-size="13">Pre-push runs the full gauntlet."</text>
    </g>

    <!-- Fanout dot -->
    <circle cx="290" cy="196" r="5" fill="#4f5d75"/>

    <!-- ===== SIX LAYER NODES (stacked vertically) ===== -->
    <!-- Layer 1: plugin-validate -->
    <g>
      <rect x="400" y="104" width="260" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="110" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="440" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALIDATE</text>
      <text x="530" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plugin-validate</text>
      <text x="530" y="152" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude plugin validate --strict .</text>
    </g>

    <!-- Layer 2: shell-lint -->
    <g>
      <rect x="400" y="172" width="260" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="178" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="428" y="187" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINT</text>
      <text x="530" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">shell-lint</text>
      <text x="530" y="220" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bash -n + shellcheck --severity=warning</text>
    </g>

    <!-- Layer 3: json-lint -->
    <g>
      <rect x="400" y="240" width="260" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="246" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="426" y="255" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="530" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">json-lint</text>
      <text x="530" y="288" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jq -e . on every tracked *.json</text>
    </g>

    <!-- Layer 4: harness-audit -->
    <g>
      <rect x="400" y="308" width="260" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="314" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="432" y="323" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUDIT</text>
      <text x="530" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">harness-audit</text>
      <text x="530" y="356" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">55 self-checks on the fleet</text>
    </g>

    <!-- Layer 5: path-hygiene -->
    <g>
      <rect x="400" y="376" width="260" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="382" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="436" y="391" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HYGIENE</text>
      <text x="530" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">path-hygiene</text>
      <text x="530" y="424" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 forms: slash, dash, bare account</text>
    </g>

    <!-- Layer 6: hook-tests -->
    <g>
      <rect x="400" y="444" width="260" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="450" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="432" y="459" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TESTS</text>
      <text x="530" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hook-tests</text>
      <text x="530" y="492" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30+ fixture-based regressions</text>
    </g>

    <!-- ===== LOG LABELS (right-aligned, dashed offshoots) ===== -->
    <g font-family="'Geist Mono', monospace" font-size="9" fill="#7a8399" letter-spacing="0.08em">
      <text x="1080" y="120" text-anchor="end">validate.log</text>
      <text x="1080" y="188" text-anchor="end">lint.log</text>
      <text x="1080" y="256" text-anchor="end">json.log</text>
      <text x="1080" y="324" text-anchor="end">audit.log</text>
      <text x="1080" y="392" text-anchor="end">pathhyg.log</text>
      <text x="1080" y="460" text-anchor="end">hooktests.log</text>
    </g>

    <!-- ===== MERGE FUNNEL ANNOTATION ===== -->
    <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" letter-spacing="0.10em">
      <text x="740" y="528" text-anchor="start">wait_layer()</text>
      <text x="740" y="540" text-anchor="start">strictest-wins</text>
    </g>

    <!-- Merge dot -->
    <circle cx="720" cy="540" r="6" fill="#4f5d75"/>

    <!-- ===== ENDPOINTS ===== -->
    <!-- Proceed (right) -->
    <rect x="820" y="596" width="220" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="930" y="618" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proceed</text>
    <text x="930" y="632" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">all 6 layers ✅</text>

    <!-- Block (left, coral focal) -->
    <rect x="170" y="644" width="240" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
    <text x="290" y="668" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Block the push</text>
    <text x="290" y="686" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">any layer ❌ → fail=1</text>

    <!-- ===== LEGEND ===== -->
    <line x1="32" y1="668" x2="1088" y2="668" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · STAGES CARRY TYPE</text>

    <rect x="32" y="696" width="20" height="10" rx="5" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
    <text x="60" y="705" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Trigger (oval)</text>

    <rect x="220" y="696" width="20" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="248" y="705" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Layer (rectangle)</text>

    <circle cx="384" cy="701" r="4" fill="#4f5d75"/>
    <text x="396" y="705" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge dot</text>

    <line x1="540" y1="701" x2="564" y2="701" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="572" y="705" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Strictest-wins branch</text>

    <line x1="760" y1="701" x2="784" y2="701" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="792" y="705" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Log file (per-layer)</text>
  </svg>
