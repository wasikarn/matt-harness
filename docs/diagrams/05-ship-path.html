<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The ship path and its two gates</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>The ship path and its two gates</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ship-title ship-desc">
      <title id="ship-title">The ship path and its two gates</title>
      <desc id="ship-desc">Process showing an edit passing the fast pre-commit gate and then the full pre-push gauntlet before it can reach the remote and the plugin cache.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="480" y1="92" x2="480" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="172" x2="480" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="252" x2="480" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="332" x2="480" y2="360" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="480" y1="412" x2="480" y2="440" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="488" y="104" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="526" y="113" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BY PATH ONLY</text>

      <rect x="488" y="264" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PASS</text>

      <rect x="488" y="424" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="433" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PASS</text>

      <line x1="616" y1="226" x2="680" y2="226" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="632" y="208" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FAIL</text>

      <line x1="616" y1="386" x2="680" y2="386" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="632" y="368" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FAIL</text>

      <rect x="344" y="40" width="272" height="52" rx="26" fill="#f5f5f5"/>
      <rect x="344" y="40" width="272" height="52" rx="26" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="480" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edit a file</text>

      <rect x="344" y="120" width="272" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="120" width="272" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git add</text>
      <text x="480" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">explicit paths, never all</text>

      <rect x="344" y="200" width="272" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="200" width="272" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pre-commit</text>
      <text x="480" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">syntax · audit · version · LOC</text>

      <rect x="344" y="280" width="272" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="280" width="272" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">commit</text>

      <rect x="344" y="360" width="272" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="360" width="272" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pre-push gauntlet</text>
      <text x="480" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6 layers, in parallel</text>

      <rect x="344" y="440" width="272" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="440" width="272" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">push, update, restart</text>

      <rect x="680" y="200" width="232" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="200" width="232" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="796" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit blocked</text>
      <text x="796" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fix it — the bypass is denied</text>

      <rect x="680" y="360" width="232" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="360" width="232" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="796" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Push blocked</text>
      <text x="796" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the log names the layer</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · CORE.HOOKSPATH MUST BE RELATIVE — AN ABSOLUTE ONE DIES SILENTLY ON RENAME</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Working tree</text>
      <rect x="180" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stage</text>
      <rect x="288" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Blocked</text>
      <rect x="400" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="432" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal — the heavy gate</text>
      <line x1="600" y1="582" x2="628" y2="582" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="636" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate rejects</text>
    </svg>
  </div>
</body>
</html>
