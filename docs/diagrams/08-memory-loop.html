<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The memory loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>The memory loop</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-title memory-desc">
      <title id="memory-title">The memory loop</title>
      <desc id="memory-desc">Layer stack from the session-loaded index down through wikilinks and per-fact detail files to deep sources, with memory-lint as the checker that decides when it is clean.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="248" y1="176" x2="288" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="712" y1="176" x2="672" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 816,208 V 344 Q 816,352 808,352 H 672" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="768" y="320" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="788" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">READS</text>

      <line x1="480" y1="208" x2="480" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="296" x2="480" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="384" x2="480" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="40" y="144" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="144" width="208" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="144" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SessionStart nudge</text>
      <text x="144" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">silent when clean</text>

      <rect x="288" y="144" width="384" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="144" width="384" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Index — MEMORY.md</text>
      <text x="480" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every session, under a byte cap</text>

      <rect x="288" y="232" width="384" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="232" width="384" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context — [[wikilinks]]</text>
      <text x="480" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">how memories reach each other</text>

      <rect x="288" y="320" width="384" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="320" width="384" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detail — one fact per file</text>
      <text x="480" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user · feedback · project · reference</text>

      <rect x="288" y="408" width="384" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="408" width="384" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deep source</text>
      <text x="480" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">qmd → docs/research, llm-wiki</text>

      <rect x="712" y="144" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="144" width="208" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="816" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">memory-lint</text>
      <text x="816" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the checker</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · TOOL-CLEAN GOVERNS — WHEN MEMORY-LINT REPORTS CLEAN, STOP</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Surfacing hook</text>
      <rect x="192" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="224" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loaded layer</text>
      <rect x="328" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Traversed layer</text>
      <rect x="488" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="520" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Last resort</text>
      <rect x="608" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="640" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal — the checker</text>
    </svg>
  </div>
</body>
</html>
