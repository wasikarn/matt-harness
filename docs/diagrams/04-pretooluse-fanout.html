<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreToolUse gate fan-out</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .note {
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 62ch;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(45,49,66,0.12);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>PreToolUse gate fan-out</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fanout-title fanout-desc">
      <title id="fanout-title">PreToolUse gate fan-out</title>
      <desc id="fanout-desc">Flowchart showing one hook registration fanning out in parallel to every matching gate, merging their verdicts strictest-first, and failing open without python3 but closed on an unparseable table.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="208" y1="96" x2="264" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="424" y1="96" x2="496" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="448" y="76" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="85" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <line x1="344" y1="136" x2="344" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="352" y="156" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="366" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <line x1="424" y1="216" x2="496" y2="216" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="448" y="196" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="205" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <line x1="344" y1="256" x2="344" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="352" y="280" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="366" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <line x1="432" y1="336" x2="536" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="584" y1="364" x2="584" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="512" y="396" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DENY / ASK</text>

      <line x1="704" y1="364" x2="704" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="712" y="396" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALLOW</text>

      <rect x="40" y="68" width="168" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="68" width="168" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="124" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool call</text>
      <text x="124" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool_name + input</text>

      <polygon points="344,56 424,96 344,136 264,96" fill="#f5f5f5"/>
      <polygon points="344,56 424,96 344,136 264,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="99" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">python3 present?</text>

      <rect x="496" y="68" width="216" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="68" width="216" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="604" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fail OPEN</text>
      <text x="604" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no gate runs at all</text>

      <polygon points="344,176 424,216 344,256 264,216" fill="#f5f5f5"/>
      <polygon points="344,176 424,216 344,256 264,216" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="219" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Table parses?</text>

      <rect x="496" y="188" width="216" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="188" width="216" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="604" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fail CLOSED</text>
      <text x="604" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deny this one call</text>

      <rect x="256" y="308" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="308" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Match, then run</text>
      <text x="344" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every gate, in parallel</text>

      <rect x="536" y="308" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="308" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="636" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge</text>
      <text x="636" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strictest wins</text>

      <rect x="440" y="428" width="216" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="428" width="216" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="548" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blocked</text>
      <text x="548" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">updatedInput dropped</text>

      <rect x="696" y="428" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="428" width="224" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="808" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Allowed</text>
      <text x="808" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">input + context applied</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · STRICTEST WINS: DENY 3 &gt; DEFER 2 &gt; ASK 1 &gt; ALLOW 0</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tool call</text>
      <rect x="168" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
      <rect x="288" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Outcome</text>
      <rect x="408" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="440" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Where verdicts merge</text>
      <line x1="592" y1="582" x2="620" y2="582" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="628" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fails closed on purpose</text>
    </svg>

    <p class="note">Verdicts merge strictest-first: deny 3, defer 2, ask 1, allow 0. A missing python3 fails the whole fan-out open, because every gate already fails open on its own. An unparseable table fails it closed.</p>
  </div>
</body>
</html>
