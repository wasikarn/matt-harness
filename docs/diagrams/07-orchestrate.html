<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The orchestrate dispatch loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>The orchestrate dispatch loop</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orchestrate-title orchestrate-desc">
      <title id="orchestrate-title">The orchestrate dispatch loop</title>
      <desc id="orchestrate-desc">Flowchart showing a pile of tasks grouped and scored, clamped to five agents per wave, gated on human approval whenever an agent can write, and run through a builder-validator chain.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="176" y1="84" x2="216" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="376" y1="84" x2="496" y2="84" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="404" y="64" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="436" y="73" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FAST PATH</text>

      <line x1="296" y1="124" x2="296" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="304" y="144" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <line x1="296" y1="224" x2="296" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="296" y1="312" x2="296" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="392" y1="372" x2="472" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="416" y="352" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="432" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WAVE</text>

      <line x1="648" y1="372" x2="712" y2="372" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="656" y="352" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="678" y="361" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WRITES</text>

      <line x1="560" y1="412" x2="560" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="568" y="432" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">READ-ONLY</text>

      <path d="M 816,400 V 420 Q 816,428 808,428 H 648 Q 640,428 640,436 V 456" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="32" y="56" width="144" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="32" y="56" width="144" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="104" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task set</text>

      <polygon points="296,44 376,84 296,124 216,84" fill="#f5f5f5"/>
      <polygon points="296,44 376,84 296,124 216,84" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="87" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fast path gate?</text>

      <rect x="496" y="56" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="56" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="596" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute inline</text>
      <text x="596" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no orchestration</text>

      <rect x="200" y="168" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="168" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Group first</text>
      <text x="296" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared mental model</text>

      <rect x="200" y="256" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="256" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score, then route</text>

      <rect x="200" y="344" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="344" width="192" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="296" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clamp to 5</text>
      <text x="296" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the lead is the clamp</text>

      <polygon points="560,332 648,372 560,412 472,372" fill="#f5f5f5"/>
      <polygon points="560,332 648,372 560,412 472,372" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="375" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write tools?</text>

      <rect x="712" y="344" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="344" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="816" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AskUserQuestion</text>
      <text x="816" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mandatory — always</text>

      <rect x="472" y="456" width="224" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="456" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Builder → Validator → Fixer</text>
      <text x="584" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">then verify each done-when</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · A SUBAGENT MAY NOT COMPLETE ITS OWN TASK — MAKER IS NOT CHECKER</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Work in</text>
      <rect x="152" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lead's step</text>
      <rect x="280" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="312" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Not orchestrated</text>
      <rect x="432" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="464" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal — the hard cap</text>
      <line x1="620" y1="582" x2="648" y2="582" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="656" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Needs approval</text>
    </svg>
  </div>
</body>
</html>
