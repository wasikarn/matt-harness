<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1120 640" role="img" aria-labelledby="mh-triad-title mh-triad-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mh-triad-title">mh@wasikarn decision-sizing triad: three yes/no questions feeding a plan-mode checkpoint.</title>
    <desc id="mh-triad-desc">Flowchart with a single start oval at the top, three decision diamonds in parallel (one-way door, blast radius, riskiest assumption), a merge dot, and two endpoints: proceed (right, white) and plan-mode checkpoint (left, coral focal). Any yes leads to the checkpoint; all no leads to proceed.</desc>

    <defs>
      <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="1120" height="640" fill="#f5f5f5"/>

    <!-- Editorial aside (top right) -->
    <g font-family="'Instrument Serif', serif" font-style="italic" fill="rgba(45,49,66,0.65)">
      <text x="1112" y="36" font-size="14" text-anchor="end">"Match rigor to stakes — under-planning a one-way door and</text>
      <text x="1112" y="56" font-size="14" text-anchor="end">over-planning a typo are the same error."</text>
    </g>

    <!-- ===== ARROWS (drawn first, behind nodes) ===== -->
    <!-- Start → first fan-out -->
    <path d="M 560 152 L 560 184" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- Fan-out to three diamonds -->
    <path d="M 560 200 L 560 216 L 220 216 L 220 240" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 560 200 L 560 240" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 560 200 L 560 216 L 900 216 L 900 240" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Each diamond: YES (left side, coral) → merge to checkpoint path -->
    <path d="M 152 304 L 152 384 L 320 384 L 320 416" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
    <path d="M 492 304 L 492 384 L 320 384" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
    <path d="M 832 304 L 832 384 L 320 384" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>

    <!-- Each diamond: NO (right side) → merge to proceed path -->
    <path d="M 288 304 L 288 360 L 660 360 L 660 384" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 628 304 L 628 360" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 968 304 L 968 360 L 660 360" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- Merge dot → endpoints -->
    <path d="M 320 472 L 320 496" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
    <path d="M 660 440 L 660 464" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- ===== ARROW LABELS ===== -->
    <!-- YES labels on coral branches (small caps, mono) -->
    <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" fill="#eb6c36" letter-spacing="0.12em">
      <rect x="138" y="346" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="152" y="355">YES</text>
      <rect x="478" y="346" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="355">YES</text>
      <rect x="818" y="346" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="832" y="355">YES</text>
    </g>

    <!-- NO labels on muted branches -->
    <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" fill="#4f5d75" letter-spacing="0.12em">
      <rect x="274" y="290" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="288" y="299">NO</text>
      <rect x="614" y="290" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="299">NO</text>
      <rect x="954" y="290" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="968" y="299">NO</text>
    </g>

    <!-- ===== START NODE (oval) ===== -->
    <rect x="460" y="104" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="560" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Non-trivial act</text>

    <!-- ===== DECISION DIAMONDS ===== -->
    <!-- Q1: One-way door? -->
    <polygon points="220,240 288,304 220,368 152,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="220" y="298" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One-way</text>
    <text x="220" y="313" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">door?</text>
    <text x="220" y="332" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">irreversible</text>

    <!-- Q2: Blast radius? -->
    <polygon points="560,240 628,304 560,368 492,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="560" y="298" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blast</text>
    <text x="560" y="313" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">radius?</text>
    <text x="560" y="332" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">wide if wrong</text>

    <!-- Q3: Riskiest assumption? -->
    <polygon points="900,240 968,304 900,368 832,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="900" y="298" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Riskiest</text>
    <text x="900" y="313" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">assumption?</text>
    <text x="900" y="332" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">probe it</text>

    <!-- ===== MERGE DOTS ===== -->
    <!-- Coral merge (any YES) -->
    <circle cx="320" cy="416" r="5" fill="#eb6c36"/>
    <!-- Muted merge (all NO) -->
    <circle cx="660" cy="384" r="5" fill="#4f5d75"/>

    <!-- ===== ENDPOINTS ===== -->
    <!-- Coral focal: Plan-mode checkpoint -->
    <rect x="220" y="496" width="200" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
    <text x="320" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plan-mode checkpoint</text>
    <text x="320" y="538" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Shift+Tab · advisor()</text>

    <!-- White: Proceed -->
    <rect x="560" y="464" width="200" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="660" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proceed</text>
    <text x="660" y="500" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trivial · known-small fix</text>

    <!-- ===== LEGEND ===== -->
    <line x1="32" y1="588" x2="1088" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="32" y="616" width="20" height="10" rx="5" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
    <text x="60" y="625" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

    <polygon points="220,621 230,616 240,621 230,626" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="248" y="625" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

    <circle cx="392" cy="621" r="4" fill="#4f5d75"/>
    <text x="404" y="625" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge (all-clear)</text>

    <circle cx="540" cy="621" r="4" fill="#eb6c36"/>
    <text x="552" y="625" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge (any-yes)</text>

    <line x1="700" y1="621" x2="724" y2="621" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="732" y="625" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">All no branch</text>

    <line x1="876" y1="621" x2="900" y2="621" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="908" y="625" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Any-yes branch (focal)</text>
  </svg>
