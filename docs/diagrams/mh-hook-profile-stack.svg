<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1120 600" role="img" aria-labelledby="mh-stack-title mh-stack-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mh-stack-title">mh@wasikarn hook enforcement: dispatch-single.sh's three-tier filter stack vs dispatch-pretooluse.sh's untiered gate path.</title>
    <desc id="mh-stack-desc">Two-part diagram. Left, a three-layer stack for 17 of the 18 hooks.json registrations, routed through dispatch-single.sh: strict (2 handlers) sits on top since it is the first tier switched off when MH_HOOK_PROFILE is lowered from its default of strict; standard (8 handlers) sits in the middle, off only if the profile is set to minimal; minimal (7 handlers) is the foundation layer, always on regardless of profile. Right, coral and dashed: the 18th hooks.json registration — PreToolUse's single dispatch-pretooluse.sh entry — fans out to 13 gate rules in pretooluse-table.json, which have no tier field at all and are immune to both MH_HOOK_PROFILE and MH_DISABLED_HOOKS — the one enforcement path no flag reaches.</desc>

    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <rect width="1120" height="600" fill="#f5f5f5"/>

    <!-- ===== ZONE CAPTIONS ===== -->
    <text x="76" y="60" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">17 REGISTRATIONS · hooks/dispatch-single.sh — TIERED, MH_HOOK_PROFILE-FILTERABLE</text>
    <text x="676" y="60" fill="rgba(235,108,54,0.85)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">13 RULES · hooks/dispatch-pretooluse.sh — UNTIERED, ALWAYS ON</text>

    <!-- directional glyph: lowering the profile peels layers from the top -->
    <path d="M 76 68 L 76 88" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- ===== LEFT: 3-LAYER PROFILE STACK ===== -->
    <!-- STRICT (top — first tier a lowered profile switches off) -->
    <g>
      <rect x="76" y="100" width="536" height="92" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="92" y="112" width="96" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="140" y="122" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER: STRICT</text>
      <text x="200" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">2 handlers</text>
      <text x="92" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">stale-task-nudge · learn-nudge</text>
      <text x="596" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">first to switch off</text>
      <text x="596" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">fires only if profile = strict</text>
    </g>

    <!-- hairline divider -->
    <line x1="76" y1="192" x2="612" y2="192" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

    <!-- STANDARD (middle) -->
    <g>
      <rect x="76" y="192" width="536" height="92" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
      <rect x="92" y="204" width="108" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="146" y="214" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER: STANDARD</text>
      <text x="200" y="240" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">8 handlers</text>
      <text x="92" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">flow-nudge · loop-repeat-nudge · +6</text>
      <text x="596" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">off only if profile = minimal</text>
      <text x="596" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">MH_DISABLED_HOOKS filters by id, first</text>
    </g>

    <line x1="76" y1="284" x2="612" y2="284" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

    <!-- MINIMAL (bottom — the foundation, always on) -->
    <g>
      <rect x="76" y="284" width="536" height="92" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="92" y="296" width="100" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="142" y="306" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER: MINIMAL</text>
      <text x="200" y="332" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">7 handlers</text>
      <text x="92" y="356" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">doctrine-bootstrap · cost-tracker · +5</text>
      <text x="596" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">the profile floor</text>
      <text x="596" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">fires at every profile setting</text>
    </g>

    <!-- outer silhouette -->
    <rect x="76" y="100" width="536" height="276" fill="none" stroke="#2d3142" stroke-width="1.2"/>

    <!-- ===== RIGHT: UNTIERED GATE PATH (coral, security/boundary treatment) ===== -->
    <g>
      <rect x="676" y="100" width="368" height="276" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="692" y="116" width="120" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="752" y="126" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRETOOLUSE · FOCAL</text>
      <text x="692" y="160" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">13 gate: rules</text>
      <text x="692" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">no tier field on any entry</text>
      <text x="692" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">immune to MH_HOOK_PROFILE</text>
      <text x="692" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">immune to MH_DISABLED_HOOKS</text>
      <line x1="692" y1="228" x2="1028" y2="228" stroke="rgba(235,108,54,0.25)" stroke-width="0.8"/>
      <text x="692" y="248" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">irrecoverable · verifier-protect ×2</text>
      <text x="692" y="262" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">db-write · task-complete-separation</text>
      <text x="692" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">jira-acli-engage · atlassian-cold-start</text>
      <text x="692" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">credential-guard · config-guard</text>
      <text x="692" y="304" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">worktree-guard ×2</text>
      <text x="692" y="352" fill="rgba(235,108,54,0.9)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">the one thing no flag</text>
      <text x="692" y="366" fill="rgba(235,108,54,0.9)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">can switch off</text>
    </g>

    <!-- ===== LEGEND ===== -->
    <line x1="76" y1="424" x2="1044" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="76" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <circle cx="220" cy="437" r="4" fill="white" stroke="#2d3142" stroke-width="1"/>
    <text x="232" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">tiered — MH_HOOK_PROFILE can turn this off</text>
    <circle cx="600" cy="437" r="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="612" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">untiered — always on, no flag reaches it</text>

    <!-- editorial aside -->
    <g font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="rgba(45,49,66,0.65)">
      <text x="76" y="484">The deny-vs-advise boundary is computational — never a tier, never a flag.</text>
    </g>
  </svg>
