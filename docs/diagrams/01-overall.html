<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the plugin does to a session</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>What the plugin does to a session</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overall-title overall-desc">
      <title id="overall-title">What the plugin does to a session</title>
      <desc id="overall-desc">Map of the three moments this plugin acts on a Claude Code session: putting doctrine and surfaces in place before, denying the irrecoverable and journalling the rest while the model works, and grading the result with deterministic verifiers whose changes only reach the next session.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="240" y1="140" x2="304" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="584" y1="140" x2="616" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="240" y1="300" x2="304" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="584" y1="300" x2="616" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="240" y1="460" x2="304" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="584" y1="460" x2="616" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="140" y1="168" x2="140" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="140" y1="328" x2="140" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 896,460 H 912 Q 920,460 920,452 V 148 Q 920,140 912,140 H 896" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="832" y="376" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="872" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NEXT SESSION</text>

      <rect x="40" y="112" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="112" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session starts</text>

      <rect x="40" y="272" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="272" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The model acts</text>

      <rect x="40" y="432" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="432" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Work ships</text>

      <rect x="304" y="112" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="112" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="444" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Doctrine injection</text>
      <text x="444" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">METHODOLOGY, every start</text>

      <rect x="616" y="112" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="112" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skills and agents</text>
      <text x="756" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from the versioned cache</text>

      <rect x="304" y="272" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="272" width="280" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="444" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deny gates</text>
      <text x="444" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the irrecoverable set</text>

      <rect x="616" y="272" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="272" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advisory sensors</text>
      <text x="756" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">journal, never block</text>

      <rect x="304" y="432" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="432" width="280" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="444" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deterministic verifiers</text>
      <text x="444" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">harness-audit · gauntlet</text>

      <rect x="616" y="432" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="432" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Version bump</text>
      <text x="756" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the only way a change lands</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · THE MODEL IS THE MAKER — EVERY CORAL BOX IS SHELL, NEVER A MODEL</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The session's own moment</text>
      <rect x="240" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What the plugin adds</text>
      <rect x="440" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="472" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Deterministic — cannot be argued with</text>
      <line x1="740" y1="582" x2="768" y2="582" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="776" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lands next session</text>
    </svg>
  </div>
</body>
</html>
