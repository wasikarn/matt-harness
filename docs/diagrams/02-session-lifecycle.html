<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session lifecycle and hook dispatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>Session lifecycle and hook dispatch</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">Session lifecycle and hook dispatch</title>
      <desc id="lifecycle-desc">Flowchart showing every non-PreToolUse hook passing through dispatch-single.sh, where a kill-switch entry or a tier above the active profile silently drops it before its script runs.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="192" y1="112" x2="240" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="400" y1="112" x2="488" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="432" y="92" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="446" y="101" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <line x1="320" y1="156" x2="320" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="328" y="176" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <line x1="320" y1="260" x2="320" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="416" y1="352" x2="536" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="448" y="332" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FILTERED</text>

      <line x1="320" y1="400" x2="320" y2="440" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="328" y="416" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="348" y="425" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FIRES</text>

      <rect x="40" y="84" width="152" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="84" width="152" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="116" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lifecycle event</text>
      <text x="116" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">9 events wired</text>

      <polygon points="320,68 400,112 320,156 240,112" fill="#f5f5f5"/>
      <polygon points="320,68 400,112 320,156 240,112" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="115" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PreToolUse?</text>

      <rect x="488" y="84" width="216" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="84" width="216" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="596" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate fan-out</text>
      <text x="596" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">its own dispatcher</text>

      <rect x="232" y="204" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="204" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dispatch-single.sh</text>
      <text x="320" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">id · tier · script</text>

      <polygon points="320,304 416,352 320,400 224,352" fill="#f5f5f5"/>
      <polygon points="320,304 416,352 320,400 224,352" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="348" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Disabled, or tier</text>
      <text x="320" y="362" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">above the profile?</text>

      <rect x="536" y="324" width="216" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="324" width="216" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="644" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Never runs</text>
      <text x="644" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">silent, no output</text>

      <rect x="232" y="440" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="440" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="320" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hook script runs</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · MINIMAL &lt; STANDARD &lt; STRICT; DEFAULT PROFILE IS STRICT</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Event</text>
      <rect x="160" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
      <rect x="280" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="312" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Not this path</text>
      <rect x="440" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="472" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: the hook fires</text>
      <line x1="640" y1="582" x2="668" y2="582" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Passes the filter</text>
    </svg>
  </div>
</body>
</html>
