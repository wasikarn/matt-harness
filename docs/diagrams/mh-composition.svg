<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1200 800" role="img" aria-labelledby="mh-comp-title mh-comp-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mh-comp-title">mh@wasikarn composing with mattpocock-skills across four typed edges: routes-to, depends-on, verifies, hands-off-to.</title>
    <desc id="mh-comp-desc">Two-zone architecture diagram. Left zone, mh@wasikarn: flow-nudge.sh, doctrine-bootstrap.sh, harness-audit check 50, and orchestrate/reference.md. Right zone, mattpocock-skills: ask-matt as the actual routing layer with no incoming hook wired to it, a 4-skill spec chain that flow-nudge routes to on every non-trivial prompt, the installed plugin itself as a coral focal node that mh depends on and verifies against, two adopted surfaces labeled as mh's own review and authoring doctrine rather than drawn as an edge, and wayfinder as the target of the one hands-off-to prose boundary. A bottom band lists the 10 skills deferred to ask-matt's own routing map, shown as a shaded zone with no arrow, since deferral is the absence of a relationship, not a relationship.</desc>

    <defs><style>@import url(https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap);</style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
    </defs>

    <rect width="1200" height="800" fill="#f5f5f5"/>

    <!-- ===== ZONE BACKGROUNDS ===== -->
    <rect x="60" y="112" width="480" height="472" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <rect x="600" y="112" width="540" height="472" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

    <rect x="104" y="120" width="120" height="14" rx="2" fill="#f5f5f5"/>
    <text x="164" y="130" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MH@WASIKARN</text>
    <rect x="644" y="120" width="152" height="14" rx="2" fill="#f5f5f5"/>
    <text x="720" y="130" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MATTPOCOCK-SKILLS</text>

    <!-- ===== ARROWS (drawn before nodes) ===== -->
    <!-- 1. flow-nudge, routes-to, spec chain -->
    <path d="M 308 184 L 450 184 L 450 256 L 600 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2. doctrine-bootstrap, depends-on, matt plugin (CORAL FOCAL) -->
    <path d="M 308 288 L 480 288 L 480 340 L 600 340" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
    <!-- 3. check 50, verifies, matt plugin (link-blue: cross-plugin check) -->
    <path d="M 308 392 L 520 392 L 520 364 L 600 364" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <!-- 4. orchestrate, hands-off-to, wayfinder (dashed: prose-only, sparse) -->
    <path d="M 308 496 L 540 496 L 540 568 L 600 568" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- ===== ARROW LABELS ===== -->
    <rect x="420" y="176" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="456" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTES-TO</text>

    <rect x="450" y="322" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="498" y="331" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPENDS-ON · REQUIRED</text>

    <rect x="490" y="378" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="522" y="387" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFIES</text>

    <rect x="500" y="488" width="88" height="12" rx="2" fill="#f5f5f5"/>
    <text x="544" y="497" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDS-OFF-TO</text>

    <!-- ===== MH ZONE NODES ===== -->
    <!-- flow-nudge.sh -->
    <g>
      <rect x="76" y="140" width="232" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="84" y="146" width="120" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="144" y="155" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USERPROMPTSUBMIT</text>
      <text x="192" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">flow-nudge.sh</text>
      <text x="192" y="198" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">emits the spec chain into</text>
      <text x="192" y="212" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">context on every trigger match</text>
    </g>

    <!-- doctrine-bootstrap.sh -->
    <g>
      <rect x="76" y="244" width="232" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="84" y="250" width="96" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="132" y="259" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSIONSTART</text>
      <text x="192" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">doctrine-bootstrap.sh</text>
      <text x="192" y="302" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">preflights the plugin's</text>
      <text x="192" y="316" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">presence — not any one skill</text>
    </g>

    <!-- harness-audit check 50 -->
    <g>
      <rect x="76" y="348" width="232" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="84" y="354" width="72" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="120" y="363" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK 50</text>
      <text x="192" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">harness-audit</text>
      <text x="192" y="406" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">4 sub-checks A–D (A–C WARN, D info)</text>
      <text x="192" y="420" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ledger ↔ plugin.json sync</text>
    </g>

    <!-- orchestrate/reference.md -->
    <g>
      <rect x="76" y="452" width="232" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="84" y="458" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="112" y="467" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOUNDARY</text>
      <text x="192" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">orchestrate/reference.md</text>
      <text x="192" y="510" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">1 of only 2 hands-off-to edges</text>
      <text x="192" y="524" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">in the whole fleet — sparse</text>
    </g>

    <!-- ===== MATTPOCOCK ZONE NODES ===== -->
    <!-- ask-matt: the router, no wired edge -->
    <g>
      <rect x="600" y="140" width="480" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="2,2"/>
      <rect x="616" y="150" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="642" y="159" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTER</text>
      <text x="700" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">ask-matt</text>
      <text x="912" y="163" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">the actual routing layer</text>
      <text x="912" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">CLAUDE.md:57 — no hook wired to it</text>
    </g>

    <!-- spec chain: routes-to target -->
    <g>
      <rect x="600" y="212" width="480" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="616" y="218" width="76" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="654" y="227" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPEC CHAIN</text>
      <text x="700" y="252" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">grilling → to-spec → to-tickets → implement</text>
      <text x="700" y="270" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">grilling fires bare (model-tier), does double duty</text>
      <text x="700" y="284" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">the other 3: user-invoked, never Skill-called</text>
    </g>

    <!-- matt plugin: depends-on + verifies target, CORAL FOCAL -->
    <g>
      <rect x="600" y="316" width="480" height="88" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.6"/>
      <rect x="616" y="322" width="112" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="672" y="331" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUIRED · NOT BUNDLED</text>
      <text x="700" y="356" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">mattpocock-skills@mattpocock v1.2.3</text>
      <text x="700" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">25 promoted / 36 shipped skills</text>
      <text x="700" y="388" fill="rgba(235,108,54,0.9)" font-size="8.5" font-weight="600" font-family="'Geist Mono', monospace">install is Quick Start step 4 — mh breaks without it</text>
    </g>

    <!-- adopted surfaces: node label, no arrow -->
    <g>
      <rect x="600" y="420" width="480" height="88" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
      <rect x="616" y="426" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="648" y="435" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADOPTED</text>
      <text x="700" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">code-review · writing-for-agents</text>
      <text x="700" y="478" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">= mh's own review + authoring surfaces</text>
      <text x="700" y="492" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">node identity, not an edge — nothing to draw</text>
    </g>

    <!-- wayfinder: hands-off-to target -->
    <g>
      <rect x="600" y="524" width="480" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="616" y="530" width="76" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="654" y="539" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USER-INVOKED</text>
      <text x="700" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">wayfinder</text>
      <text x="700" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">multi-session decision maps</text>
      <text x="700" y="596" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">a prose pointer, not a runtime check</text>
    </g>

    <!-- ===== DEFERRED BAND (shaded zone, no arrow — deferral is an absence) ===== -->
    <rect x="60" y="620" width="1080" height="112" rx="6" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8" stroke-dasharray="2,2"/>
    <rect x="76" y="632" width="220" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
    <text x="186" y="642" fill="rgba(45,49,66,0.7)" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEFERRED — ASK-MATT'S MAP, NOT DUPLICATED</text>
    <text x="76" y="672" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">codebase-design · prototype · resolving-merge-conflicts · wizard · triage</text>
    <text x="76" y="690" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace">grill-me · handoff · teach · to-questionnaire · wait-what</text>
    <text x="76" y="712" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace">10 of 25 promoted skills · standing v0.46.0 design · no arrow drawn — deferral is the absence of a relationship</text>

    <!-- ===== LEGEND ===== -->
    <line x1="60" y1="748" x2="1140" y2="748" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="60" y="764" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND · graph-model.md's 4 typed edges</text>

    <line x1="60" y1="782" x2="84" y2="782" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="92" y="786" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">routes-to</text>

    <line x1="220" y1="782" x2="244" y2="782" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
    <text x="252" y="786" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">depends-on (focal)</text>

    <line x1="420" y1="782" x2="444" y2="782" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
