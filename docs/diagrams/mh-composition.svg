    <line x1="580" y1="782" x2="604" y2="782" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="612" y="786" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">hands-off-to (prose-only)</text>

    <rect x="840" y="776" width="16" height="12" rx="2" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.15)" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="864" y="786" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">deferred / router — no edge</text>
