<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The tiered pipeline: Fable to Sonnet to Opus</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .note {
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 62ch;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(45,49,66,0.12);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>The tiered pipeline: Fable to Sonnet to Opus</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tiered-pipeline-title tiered-pipeline-desc">
      <title id="tiered-pipeline-title">The tiered pipeline: Fable to Sonnet to Opus</title>
      <desc id="tiered-pipeline-desc">Four stages of the tiered pipeline, each fenced by a shell gate that holds the boundary. Model selection is prompt-only — no script enforces which tier runs at each stage.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="480" y1="108" x2="480" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="228" x2="480" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="348" x2="480" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="488" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">next</text>

      <rect x="488" y="256" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">next</text>

      <rect x="488" y="376" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="524" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">gates</text>

      <rect x="40" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="80" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fable plans</text>
      <text x="140" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the prompt</text>

      <rect x="40" y="200" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sonnet executes</text>
      <text x="140" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the work</text>

      <rect x="40" y="320" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="320" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Opus reviews</text>
      <text x="140" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fix loop, cap 3</text>

      <rect x="40" y="440" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="440" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fable re-reviews</text>
      <text x="140" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">triage-gated</text>

      <rect x="720" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="80" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="820" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">shell-enforced</text>
      <text x="820" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stage boundaries</text>

      <rect x="720" y="200" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="820" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prompt-only</text>
      <text x="820" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">model selection</text>

      <rect x="720" y="320" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="320" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="820" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">counted in code</text>
      <text x="820" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">three retries then stop</text>

      <rect x="720" y="440" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="440" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="820" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">prompt-only</text>
      <text x="820" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">discretionary</text>

      <line x1="240" y1="108" x2="720" y2="108" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="240" y1="228" x2="720" y2="228" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="240" y1="348" x2="720" y2="348" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="240" y1="468" x2="720" y2="468" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="40" y1="40" x2="920" y2="40" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · STAGE ENVELOPES ARE PROMPT-ONLY</text>
      <rect x="40" y="76" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="72" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stage</text>
      <rect x="220" y="76" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What it does</text>
      <rect x="440" y="76" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What enforces it</text>
    </svg>

    <p class="note">The fix loop is counted in code at three retries; everything else (which model, when to triage) is prompt-only. Same maker-not-checker rule as the gates: a script can count, but it cannot pick.</p>
  </div>
</body>
</html>
