<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1000 820" role="img" aria-labelledby="mh-pipe-title mh-pipe-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mh-pipe-title">mh:tiered-pipeline: Fable plans, Sonnet executes, Opus reviews then bug-hunts on a shared fix-retry budget, Fable does a triage-gated final review.</title>
    <desc id="mh-pipe-desc">Flowchart. A task enters Plan (Fable), then Execute (Sonnet), then a combined Review and Bug-hunt stage (Opus) that draws fix retries from one shared budget of 3, applied by Sonnet. A decision checks whether that budget is exhausted mid-loop: if yes, the run escalates to a human, coral focal, and stops. If no, a second decision checks whether the run is contested — any fix was used, or confidence fell below 0.75. A contested run gets a Fable final review before the result returns to a human; an uncontested run skips straight to the same result endpoint. Nothing in the pipeline commits, pushes, or ships on its own.</desc>

    <defs>
      <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="1000" height="820" fill="#f5f5f5"/>

    <!-- Editorial aside (top right) -->
    <g font-family="'Instrument Serif', serif" font-style="italic" fill="rgba(45,49,66,0.65)">
      <text x="960" y="28" font-size="12.5" text-anchor="end">"Unconditional extra tiers degrade agreement" —</text>
      <text x="960" y="46" font-size="12.5" text-anchor="end">TAO, arXiv:2506.12482. Final review is gated on purpose.</text>
    </g>

    <!-- ===== ARROWS (drawn before nodes) ===== -->
    <path d="M 500 80 L 500 112" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 184 L 500 204" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 276 L 500 296" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 392 L 500 420" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- shared-budget retry self-loop on Review→Bug-hunt box -->
    <path d="M 700 368 L 760 368 L 760 300 L 700 300" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

    <!-- decision5 YES -> escalate (coral) -->
    <path d="M 572 472 L 650 472" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
    <!-- decision5 NO -> decision7 -->
    <path d="M 500 524 L 500 548" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- decision7 YES -> final -->
    <path d="M 572 600 L 650 600 L 650 604" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- decision7 NO -> done (orthogonal elbow, offset attach point) -->
    <path d="M 500 652 L 500 690 L 460 690 L 460 712" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- final -> done (orthogonal elbow, offset attach point, fanned 100px from the NO branch) -->
    <path d="M 780 636 L 780 690 L 560 690 L 560 712" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

    <!-- ===== ARROW LABELS ===== -->
    <rect x="586" y="466" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="600" y="475" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>

    <rect x="486" y="530" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="500" y="539" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>

    <rect x="586" y="594" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="600" y="603" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>

    <rect x="446" y="670" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="460" y="679" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>

    <rect x="746" y="352" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="776" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY ≤3</text>

    <!-- ===== START (oval) ===== -->
    <rect x="400" y="32" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="500" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task</text>

    <!-- ===== PLAN (Fable) ===== -->
    <g>
      <rect x="340" y="112" width="320" height="72" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="120" width="88" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="396" y="130" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FABLE · PLAN</text>
      <text x="500" y="152" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">survey + plan</text>
      <text x="500" y="170" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mechanical acceptance criteria</text>
    </g>

    <!-- ===== EXECUTE (Sonnet) ===== -->
    <g>
      <rect x="340" y="204" width="320" height="72" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="212" width="104" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="404" y="222" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SONNET · EXECUTE</text>
      <text x="500" y="244" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">implement the plan</text>
      <text x="500" y="262" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verify the plan's own criteria</text>
    </g>

    <!-- ===== REVIEW -> BUG-HUNT (Opus, shared budget) ===== -->
    <g>
      <rect x="300" y="296" width="400" height="96" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="304" width="184" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="404" y="314" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPUS · REVIEW → BUG-HUNT</text>
      <text x="500" y="338" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">independent re-verify, then fresh-eyes pass</text>
      <text x="500" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one shared fix-retry budget, not one per stage</text>
      <text x="500" y="376" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Sonnet applies each fix; verdicts are schema-forced</text>
    </g>

    <!-- ===== DECISION 5: cap exhausted? ===== -->
    <polygon points="500,420 572,472 500,524 428,472" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="466" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">budget (3)</text>
    <text x="500" y="480" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">exhausted?</text>

    <!-- ===== ESCALATE (coral focal, end) ===== -->
    <g>
      <rect x="650" y="444" width="220" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="760" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Escalated</text>
      <text x="760" y="486" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to human — never re-dispatched</text>
    </g>

    <!-- ===== DECISION 7: contested? ===== -->
    <polygon points="500,548 572,600 500,652 428,600" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="594" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">contested?</text>
    <text x="500" y="608" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">fix used or conf&lt;0.75</text>

    <!-- ===== FINAL (Fable, gated) ===== -->
    <g>
      <rect x="650" y="572" width="260" height="64" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="662" y="580" width="88" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="706" y="590" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FABLE · FINAL</text>
      <text x="780" y="612" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gated final review</text>
      <text x="780" y="628" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">skipped when uncontested</text>
    </g>

    <!-- ===== DONE (end) ===== -->
    <g>
      <rect x="380" y="712" width="240" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="736" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Result → human</text>
      <text x="500" y="754" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing here commits or ships</text>
    </g>

    <!-- ===== LEGEND ===== -->
    <line x1="60" y1="784" x2="940" y2="784" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="60" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

    <rect x="60" y="806" width="20" height="10" rx="5" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
    <text x="88" y="815" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

    <rect x="220" y="806" width="20" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="248" y="815" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stage — model tagged (rect)</text>

    <polygon points="440,806 450,801 460,806 450,811" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="468" y="815" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

    <line x1="620" y1="811" x2="644" y2="811" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="652" y="815" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retry / branch</text>

    <line x1="780" y1="811" x2="804" y2="811" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="812" y="815" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escalation (focal)</text>
  </svg>
