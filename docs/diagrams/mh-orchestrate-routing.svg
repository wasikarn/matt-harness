<?xml version="1.0" encoding="UTF-8"?>
<svg class="diagram" viewBox="0 0 1040 820" role="img" aria-labelledby="mh-orch-title mh-orch-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="mh-orch-title">mh:orchestrate routing: Fast Path Gate, matrix selection, a security override, four route verdicts, and the unenforced fan-out clamp.</title>
    <desc id="mh-orch-desc">Flowchart. Tasks enter a Fast Path Gate decision: if all four conditions hold (single bounded task, small deterministic-checkable output, not security-sensitive), execution happens inline and the flow ends there. Otherwise the flow proceeds to a grouping step that merges items needing the same mental model, then a matrix-selection step choosing among Eisenhower, Impact times Effort, or Value times Risk depending on time pressure versus backlog versus architecture-bet framing. A coral dashed side callout notes that any item touching auth, secrets, crypto, input validation, or dependencies overrides the matrix and routes to security-reviewer first, regardless of quadrant. The matrix step feeds one of four route verdicts -- inline, parallel, sequential, or drop -- which then passes through a fan-out clamp step noting the hard cap of five agents per wave has no automatic enforcement in the repo; the lead is the clamp. The flow ends at an output table of task, route, agent, done-when, and status.</desc>

    <defs>
      <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="1040" height="820" fill="#f5f5f5"/>

    <!-- ===== ARROWS (drawn before nodes) ===== -->
    <path d="M 500 80 L 500 96" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- fast-path YES -> inline end -->
    <path d="M 590 160 L 650 160" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- fast-path NO -> group -->
    <path d="M 500 224 L 500 256" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 328 L 500 360" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 460 L 500 492" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 580 L 500 612" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 500 692 L 500 724" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <!-- matrix -> security override (coral, cross-cutting) -->
    <path d="M 720 400 L 800 400" stroke="#eb6c36" stroke-width="1.4" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow-accent)"/>

    <!-- ===== ARROW LABELS ===== -->
    <rect x="536" y="154" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="550" y="163" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>

    <rect x="486" y="234" width="28" height="12" rx="2" fill="#f5f5f5"/>
    <text x="500" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>

    <rect x="726" y="380" width="68" height="12" rx="2" fill="#f5f5f5"/>
    <text x="760" y="389" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ANY QUADRANT</text>

    <!-- ===== START (oval) ===== -->
    <rect x="400" y="32" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="500" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Competing tasks arrive</text>

    <!-- ===== FAST PATH GATE (diamond) ===== -->
    <polygon points="500,96 590,160 500,224 410,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="500" y="150" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fast Path Gate</text>
    <text x="500" y="163" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">all 4 hold?</text>
    <text x="500" y="176" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">bounded · small · checkable · non-security</text>

    <!-- ===== INLINE END ===== -->
    <g>
      <rect x="650" y="132" width="220" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute inline</text>
      <text x="760" y="174" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skips all orchestration below</text>
    </g>

    <!-- ===== GROUP (Step 0) ===== -->
    <g>
      <rect x="340" y="256" width="320" height="72" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="352" y="264" width="80" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="392" y="274" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP 0</text>
      <text x="500" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Group before scoring</text>
      <text x="500" y="314" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">merge items needing the same mental model</text>
    </g>

    <!-- ===== MATRIX ===== -->
    <g>
      <rect x="280" y="360" width="440" height="100" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="292" y="368" width="104" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="378" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PICK THE MATRIX</text>
      <text x="500" y="402" fill="#2d3142" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">Eisenhower — time pressure, deadlines</text>
      <text x="500" y="420" fill="#2d3142" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">Impact × Effort — backlog, no real urgency</text>
      <text x="500" y="438" fill="#2d3142" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">Value × Risk — architecture bets, "build this at all?"</text>
      <text x="500" y="454" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">no numeric scoring — binary high/low only</text>
    </g>

    <!-- ===== SECURITY OVERRIDE (coral, Security/Boundary treatment) ===== -->
    <g>
      <rect x="800" y="356" width="220" height="108" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1.4" stroke-dasharray="4,4"/>
      <rect x="812" y="364" width="88" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="856" y="374" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OVERRIDE</text>
      <text x="910" y="396" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Security override</text>
      <text x="910" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">auth · secrets · crypto</text>
      <text x="910" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">input-validation · dependencies</text>
      <text x="910" y="448" fill="rgba(235,108,54,0.9)" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">→ security-reviewer first,</text>
      <text x="910" y="460" fill="rgba(235,108,54,0.9)" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">write agent takes it after</text>
    </g>

    <!-- ===== 4 ROUTE VERDICTS ===== -->
    <g>
      <rect x="300" y="492" width="400" height="88" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="500" width="104" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="364" y="510" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 VERDICTS</text>
      <text x="500" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">inline · parallel · sequential · drop</text>
      <text x="500" y="554" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Path-column word translates — never copied verbatim</text>
      <text x="500" y="568" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">deferred / dropped rows need a re-open condition</text>
    </g>

    <!-- ===== FAN-OUT CLAMP ===== -->
    <g>
      <rect x="300" y="612" width="400" height="80" rx="6" fill="white" stroke="#2d3142" stroke-width="1"/>
      <rect x="312" y="620" width="96" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="360" y="630" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAN-OUT CAP</text>
      <text x="500" y="654" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clamp before spawning</text>
      <text x="500" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">hard cap 5/wave · prefer 2–4 · no floor</text>
      <text x="500" y="686" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no automatic enforcement — the lead is the clamp</text>
    </g>

    <!-- ===== OUTPUT END ===== -->
    <g>
      <rect x="350" y="724" width="300" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="748" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Output table</text>
      <text x="500" y="766" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task · route · agent · done-when · status</text>
    </g>
  </svg>
