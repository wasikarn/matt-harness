<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a request actually goes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>Where a request actually goes</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="routing-title routing-desc">
      <title id="routing-title">Where a request actually goes</title>
      <desc id="routing-desc">Flowchart routing a prompt to inline execution, a skill, a subagent, or the orchestrate triage loop, based on whether the task is bounded and whether it arrived alone.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="200" y1="112" x2="248" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="424" y1="112" x2="472" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="648" y1="112" x2="712" y2="112" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="656" y="92" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="101" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BOUNDED</text>

      <line x1="560" y1="156" x2="560" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="568" y="188" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <path d="M 472,272 H 272 Q 264,272 264,280 V 396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="308" y="252" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PROCEDURE</text>

      <line x1="560" y1="316" x2="560" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="568" y="352" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="606" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OWN CONTEXT</text>

      <path d="M 648,272 H 816 Q 824,272 824,280 V 396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="712" y="252" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MANY ASKS</text>

      <rect x="40" y="84" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="84" width="160" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User prompt</text>

      <rect x="248" y="84" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="84" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advisory nudges</text>
      <text x="336" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never blocks</text>

      <polygon points="560,68 648,112 560,156 472,112" fill="#f5f5f5"/>
      <polygon points="560,68 648,112 560,156 472,112" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bounded — one file,</text>
      <text x="560" y="122" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">one behaviour?</text>

      <rect x="712" y="84" width="208" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="84" width="208" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="816" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute inline</text>
      <text x="816" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fast path gate</text>

      <polygon points="560,228 648,272 560,316 472,272" fill="#f5f5f5"/>
      <polygon points="560,228 648,272 560,316 472,272" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="268" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One ask,</text>
      <text x="560" y="282" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">or a pile?</text>

      <rect x="176" y="396" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="176" y="396" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skill</text>
      <text x="264" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">procedure, this context</text>

      <rect x="472" y="396" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="396" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
      <text x="560" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">separate context</text>

      <rect x="728" y="396" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="396" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="824" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrate</text>
      <text x="824" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">triage, then dispatch</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · THE WORKFLOW TOOL IS NOT HERE — IT NEEDS EXPLICIT USER OPT-IN</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Prompt</text>
      <rect x="152" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Executor</text>
      <rect x="280" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="312" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal — cheapest correct route</text>
      <line x1="520" y1="582" x2="548" y2="582" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="556" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fast path</text>
      <line x1="680" y1="582" x2="708" y2="582" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="716" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
    </svg>
  </div>
</body>
</html>
