<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adding or removing a surface</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>Adding or removing a surface</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="surface-title surface-desc">
      <title id="surface-title">Adding or removing a surface</title>
      <desc id="surface-desc">Seven ordered steps for adding a plugin surface, where the cache refresh has to happen before the commit rather than after it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="240" y1="188" x2="264" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="464" y1="188" x2="488" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="688" y1="188" x2="712" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="812" y1="220" x2="812" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="712" y1="388" x2="688" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="488" y1="388" x2="464" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="40" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">01</text>

      <rect x="40" y="156" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="156" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create the file</text>
      <text x="140" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bucket: frontmatter</text>

      <text x="264" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">02</text>

      <rect x="264" y="156" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="156" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="364" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wire the hook</text>
      <text x="364" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hooks.json + tests</text>

      <text x="488" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">03</text>

      <rect x="488" y="156" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="156" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="588" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bump both manifests</text>
      <text x="588" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plugin + marketplace</text>

      <text x="712" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">04</text>

      <rect x="712" y="156" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="156" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="812" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sync fleet counts</text>
      <text x="812" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync-fleet-counts.sh</text>

      <text x="712" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">05</text>

      <rect x="712" y="356" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="356" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="812" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate and audit</text>
      <text x="812" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plugin validate + audit.sh</text>

      <text x="488" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">06</text>

      <rect x="488" y="356" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="356" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="588" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">claude plugin update</text>
      <text x="588" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BEFORE the commit</text>

      <text x="264" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">07</text>

      <rect x="264" y="356" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="356" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="364" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Regen, commit, restart</text>
      <text x="364" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BOUNDARY.md last</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · A BRAND-NEW FILE READS AS CRIT F1 UNTIL STEP 06 REFRESHES THE CACHE</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ordered step</text>
      <rect x="200" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="232" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: the out-of-order one</text>
      <line x1="440" y1="582" x2="468" y2="582" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="476" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sequence</text>
    </svg>
  </div>
</body>
</html>
