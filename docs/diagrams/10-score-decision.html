<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rule 14: the score-decision rubric</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .note {
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 62ch;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(45,49,66,0.12);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>Rule 14: the score-decision rubric</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="score-decision-title score-decision-desc">
      <title id="score-decision-title">Rule 14: the score-decision rubric</title>
      <desc id="score-decision-desc">Four weighted criteria feed a numeric verdict; a fatal-weakness floor sits below them and must hold regardless of the total. Precedent is queried first.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <polygon points="64,16 208,72 64,128 -80,72" fill="#f5f5f5"/>
      <polygon points="64,16 208,72 64,128 -80,72" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="64" y="68" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decision?</text>
      <text x="64" y="82" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text>

      <line x1="208" y1="100" x2="304" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="148" x2="432" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="228" x2="432" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="308" x2="432" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="388" x2="432" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="100" x2="304" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="148" x2="304" y2="228" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="304" y1="228" x2="304" y2="308" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <line x1="304" y1="308" x2="304" y2="388" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="432" y="120" width="328" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="120" width="328" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Criterion 1</text>
      <text x="596" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alignment with stated goal</text>

      <rect x="432" y="200" width="328" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="200" width="328" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Criterion 2</text>
      <text x="596" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evidence for the claim</text>

      <rect x="432" y="280" width="328" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="280" width="328" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Criterion 3</text>
      <text x="596" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">risk under the chosen path</text>

      <rect x="432" y="360" width="328" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="360" width="328" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Criterion 4</text>
      <text x="596" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cost of being wrong</text>

      <line x1="64" y1="464" x2="896" y2="464" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <rect x="64" y="488" width="832" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="488" width="832" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fatal-weakness floor</text>
      <text x="480" y="528" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">must hold regardless of total score</text>

      <line x1="40" y1="40" x2="920" y2="40" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · PASS THRESHOLD AND FLOOR BOTH REQUIRED</text>
      <rect x="40" y="76" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="72" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision gate</text>
      <rect x="220" y="76" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Weighted criterion</text>
      <rect x="440" y="76" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The floor</text>
    </svg>

    <p class="note">The rubric is structured but prompt-only — no script enforces model choice, weights, or the floor. Same honesty as the gates: a script can score, but it cannot reason.</p>
  </div>
</body>
</html>
