<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the advisory sensors do instead of blocking</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">mh@wasikarn · Diagram Design</p>
    <h1>What the advisory sensors do instead of blocking</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="advisory-title advisory-desc">
      <title id="advisory-title">What the advisory sensors do instead of blocking</title>
      <desc id="advisory-desc">Data flow showing the four events this plugin's advisory sensors observe and the two things they produce — context the model is free to ignore, and state on disk — but never a permission decision.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="288" y1="126" x2="376" y2="126" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="288" y1="202" x2="376" y2="202" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="288" y1="278" x2="376" y2="278" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="288" y1="354" x2="376" y2="354" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="600" y1="172" x2="680" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="600" y1="340" x2="680" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="604" y="152" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="161" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO DECISION</text>

      <rect x="40" y="100" width="248" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="100" width="248" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="164" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UserPromptSubmit</text>
      <text x="164" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flow · jira-route</text>

      <rect x="40" y="176" width="248" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="176" width="248" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="164" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostToolUse</text>
      <text x="164" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loop · plan-review · compliance</text>

      <rect x="40" y="252" width="248" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="252" width="248" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="164" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostToolUseFailure</text>
      <text x="164" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mcp-failure</text>

      <rect x="40" y="328" width="248" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="328" width="248" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="164" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SessionEnd</text>
      <text x="164" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">learn</text>

      <rect x="376" y="100" width="224" height="308" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="100" width="224" height="308" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advisory sensors</text>
      <text x="488" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read, count, journal</text>

      <rect x="680" y="140" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="140" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="800" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context into the turn</text>
      <text x="800" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the model may ignore it</text>

      <rect x="680" y="308" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="308" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">State on disk</text>
      <text x="800" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.local/share/</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · AN ADVISORY SENSOR NEVER EMITS PERMISSIONDECISION — DENYING IS THE GATES' JOB</text>
      <rect x="40" y="576" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Event observed</text>
      <rect x="200" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Where the sensors live</text>
      <rect x="400" y="576" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="432" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What reaches the model</text>
      <rect x="620" y="576" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="652" y="586" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What survives the session</text>
    </svg>
  </div>
</body>
</html>
