# harness-audit.yml — the harness's self-audit pipeline.
#
# Runs the deterministic audit (skills/harness-audit/scripts/audit.sh),
# fans out two review lenses (a general code review and a security
# sweep over the diff since the last audit), then a deterministic
# evaluate step (eval/run-eval.py) gates the build. This is the
# "audit harness" example — a workflow spec that USES the harness's
# own tools. The point: if a future spec author wonders "how do I
# wire my own workflow to the harness's audit + eval + docs-check?",
# this is the answer.
#
# All agent stages are dispatched by the lead; the deterministic
# stages are what `--execute` runs in CI. The spec is intentionally
# small (3 stages) so it works as a smoke test for the dispatcher
# itself — `orchestrate-dispatch.py harness-audit.yml --emit-plan`
# should produce a clean 3-wave plan.
#
# Spec author: harness-architect
# Compatible with: scripts/orchestrate-dispatch.py v1

name: harness-audit
description: Run the audit script, fan out 2 review lenses, then evaluate.

stages:
  - id: audit
    type: command
    command: "bash \"${KBG_PLUGIN_ROOT}/skills/harness-audit/scripts/audit.sh\" \"${KBG_PLUGIN_ROOT}\""
    done_when: "audit exits 0 OR audit exits non-zero with structured findings JSON"

  - id: review-fanout
    type: parallel
    depends_on: [audit]
    panel: true   # fixed 2-lens review panel (code-review + security), not an
                  # under-split builder fan-out — opts out of the F8.4 min-3 floor.
    done_when: "both review agents returned reports"
    stages:
      - id: code-review
        type: agent
        agent_type: code-reviewer
        prompt: "Review the diff since the last audit (use `git diff <last-audit-sha>..HEAD`). Emit a JSON report: {findings: [{file, line, severity, rule}]}."
        done_when: "report.json exists at .scratch/harness-audit/code-review.json"
      - id: security-sweep
        type: agent
        agent_type: security-reviewer
        prompt: "Sweep the diff since the last audit for OWASP, secrets, auth, supply-chain risks. Emit a JSON report: {findings: [{file, line, severity, owasp}]}."
        done_when: "report.json exists at .scratch/harness-audit/security.json"

  - id: evaluate
    type: command
    depends_on: [review-fanout]
    command: "python3 \"${KBG_PLUGIN_ROOT}/eval/run-eval.py\" --dataset \"${KBG_PLUGIN_ROOT}/eval/datasets/\" --regression --gate"
    done_when: "eval exits 0 (all dataset graders pass) OR exits 1 with structured failure list"
