# ship-merge.yml — minimal "build → review → test → ship" workflow.
#
# The smallest spec that exercises all four stage types: a command
# (build), a parallel validator (lint + typecheck fan-out), a command
# (test), and an agent stage (the merge agent that opens the PR).
#
# Use as the "hello world" example when teaching the dispatcher shape:
# 4 stages, 3 waves, 1 agent dispatch at the end. The deterministic
# chain (build → lint/typecheck → test) is what `--execute` runs in
# CI; the merge-agent is the lead-gated dispatch.
#
# Spec author: harness-architect
# Compatible with: scripts/orchestrate-dispatch.py v1

name: ship-merge
description: Build, fan-out lint+typecheck, test, then dispatch a merge agent.

stages:
  - id: build
    type: command
    command: "make build"
    done_when: "binary exists at expected path or `make build` exits 0"

  - id: validate
    type: parallel
    depends_on: [build]
    done_when: "all sub-stages exit 0"
    stages:
      - id: lint
        type: command
        command: "ruff check ."
        done_when: "ruff exits 0"
      - id: typecheck
        type: command
        command: "tsc --noEmit"
        done_when: "tsc exits 0"

  - id: test
    type: command
    depends_on: [validate]
    command: "pytest -q"
    done_when: "pytest exits 0 with 0 failures"

  - id: merge-agent
    type: agent
    depends_on: [test]
    agent_type: backend-engineer
    prompt: |
      Open a PR with the diff from `build → validate → test`. The
      validation chain has passed; your job is the merge commit and
      PR description. Files you own: CHANGELOG.md, the PR body.
      Do not re-run validation; the chain already proved it.
    done_when: "PR exists at HEAD~1..HEAD and CHANGELOG entry landed"
