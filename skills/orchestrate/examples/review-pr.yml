# review-pr.yml — multi-lens PR review pipeline.
#
# Demonstrates the fan-in pattern: ONE PR with N parallel validator
# agents (security, test-coverage, error-handling, comment-accuracy),
# then a single fix step gated on the merged report, then a
# re-validator. This is the "judge panel" composition from the METHODOLOGY
# orchestration doctrine (Rule 13) — diverse lenses catch failure modes
# redundancy can't.
#
# All validator stages are `agent` type because they require LLM
# judgment; the orchestrating lead (consuming this spec via the dispatch
# flow) dispatches them in Wave 1. The deterministic `merge-reports` command in Wave 2
# is what the dispatcher actually runs in `--execute` mode; the
# validator agents are rendered as "would-spawn" lines.
#
# The loop stage `fix-loop` re-runs the validators until either all
# pass or 3 iterations elapse. Loop-until-done is bounded by
# `--max-iterations` on the body stages (the dispatcher's loop body
# runs `--max-iterations` times max; the spec author decides the cap).
#
# Spec author: harness-architect
# Compatible with: scripts/orchestrate-dispatch.py v1

name: review-pr
description: Fan-out 4 review lenses, merge findings, fix-loop, re-validate.

stages:
  - id: review-fanout
    type: parallel
    done_when: "all 4 validator agents returned a structured report"
    stages:
      - id: security
        type: agent
        agent_type: security-reviewer
        prompt: "Review the diff for OWASP, secrets, auth, supply-chain. Emit a JSON report: {findings: [{file, line, severity, owasp}]}."
        done_when: "report.json exists at .scratch/review-pr/security.json"
      - id: test-coverage
        type: agent
        agent_type: pr-test-analyzer
        prompt: "Score the diff 1-10 on behavioral criticality of untested paths. Emit a JSON report with untested_paths and risk_rating."
        done_when: "report.json exists at .scratch/review-pr/coverage.json"
      - id: error-handling
        type: agent
        agent_type: silent-failure-hunter
        prompt: "Audit the diff for swallowed errors, broad catches, hidden fallbacks. Emit a JSON report: {findings: [{file, line, severity, pattern}]}."
        done_when: "report.json exists at .scratch/review-pr/errors.json"
      - id: comments
        type: agent
        agent_type: comment-analyzer
        prompt: "Audit the diff's docstrings and inline comments for accuracy and value. Emit a JSON report: {stale: [{file, line, comment}]}."
        done_when: "report.json exists at .scratch/review-pr/comments.json"

  - id: merge-reports
    type: command
    depends_on: [review-fanout]
    command: "python3 \"${KBG_PLUGIN_ROOT}/scripts/merge-review-reports.py\" .scratch/review-pr/"
    done_when: "merged-report.json exists and the 4-step merge (Reports / Conflict Resolution / Priority / Action Plan) completed"

  - id: fix-loop
    type: loop
    depends_on: [merge-reports]
    loop_until: "all findings closed OR iteration == 3"
    max_iterations: 3
    body:
      - id: apply-fixes
        type: agent
        agent_type: backend-engineer
        prompt: "Apply the merged action plan from merged-report.json. Do NOT re-review; just apply. Files you own are listed in the action plan's owner column."
        done_when: "diff matches the action plan's 'edits' list"
      - id: re-validate
        type: agent
        agent_type: code-reviewer
        prompt: "Verify the fixes close the original findings. Emit pass/fail per finding id from the merged report."
        done_when: "findings closed count == total findings count from merged report"
