name: harness-audit-drift

# Scheduled counterpart to validate.yml's push/PR-triggered harness-audit job:
# catches drift that isn't triggered by any commit (e.g. a check's own
# assumption going stale). Narrowly scoped -- see issue #116 and
# docs/research/warp-self-improving-agents-article-audit-2026-08-28.md
# candidate 3: this only runs harness-audit. gate-journal-summary.sh and
# feedback-surface-scan.py both read local developer-machine state
# (~/.local/share/kbg/metrics, ~/.claude/projects/.../memory) that doesn't
# exist on a CI runner, so neither is part of this job.
#
# The CRIT-triggered comment also names this gap explicitly (2026-08-28) --
# built as the accepted alternative to ADR 0011 (docs/research/
# adr-0011-scheduled-recursive-improve-invocation.md, rejected same day: a
# scheduled local cron/launchd cold-start of recursive-improve itself was
# judged not worth crossing the no-model-self-launch invariant for). This
# stays pure computation, no model invocation, so the invariant is untouched.

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday 09:00 UTC -- adjust cadence as desired
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  harness-audit-drift:
    name: harness-audit (scheduled drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run harness-audit, comment on issue #116 only if CRIT > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(bash skills/meta/harness-audit/scripts/audit.sh . 2>&1)"
          rc=$?
          echo "$output"
          set -e
          if [ "$rc" -gt 0 ]; then
            {
              echo "Scheduled harness-audit drift check found CRIT findings."
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo ""
              echo '```'
              echo "$output"
              echo '```'
              echo ""
              echo "Note: this is 1 of \`recursive-improve\`'s 3 Observe-step signals. The other"
              echo "two -- the gate-verdict journal and feedback-memory clusters -- read"
              echo "local-machine-only state this CI runner can't see (ADR:"
              echo "\`docs/research/adr-0011-scheduled-recursive-improve-invocation.md\`, rejected"
              echo "2026-08-28 -- CI can't safely pull them either). Run \`/mh:recursive-improve\`"
              echo "locally to pick those up; this comment only ever reflects harness-audit."
            } > /tmp/drift-comment.md
            gh issue comment 116 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/drift-comment.md
          fi
