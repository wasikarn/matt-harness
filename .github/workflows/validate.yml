name: validate-plugin

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to develop each get
# their own group (the sha) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLAUDE_CODE_VERSION: "2.1.287"

jobs:
  validate-plugin:
    name: claude plugin validate (marketplace strict + plugin manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}

      - name: validate marketplace manifest (strict)
        run: claude plugin validate --strict .

      # `.` alone resolves to marketplace.json when both files sit in this
      # repo's shared .claude-plugin/ dir (confirmed via --json's "target"
      # field), so plugin.json itself needs its own explicit path here.
      # --strict is dropped only because it would fail on a single
      # known-benign warning ("CLAUDE.md not loaded as project context") that
      # is true and intentional — METHODOLOGY.md ships via hooks instead.
      - name: validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json

  harness-audit:
    name: harness-audit (0 CRIT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: run harness-audit
        run: bash skills/meta/harness-audit/scripts/audit.sh .

  # The test layer is split across 5 runners (GH #400): one runner per shard
  # and serial inside it (CI keeps GAUNTLET_JOBS=1), so the 8 s timing rows
  # never share a CPU. Shard 1 also runs validate + lint. 5 because
  # test-gates.sh alone is the slowest shard at N=5; more shards buy nothing.
  gauntlet-shard:
    name: gauntlet shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      GAUNTLET_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}

      - name: install trash-cli
        run: sudo apt-get update && sudo apt-get install -y trash-cli

      - name: verify trash is on PATH
        run: command -v trash

      - name: run gauntlet
        run: bash scripts/run-gauntlet.sh

  # Keeps the required check name branch protection matches. Runs even when a
  # shard fails, and goes red unless every shard succeeded (a failed,
  # cancelled or skipped shard all count as not passing).
  gauntlet:
    name: gauntlet (run-gauntlet.sh)
    needs: gauntlet-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: all shards passed
        env:
          RESULT: ${{ needs.gauntlet-shard.result }}
        run: |
          echo "gauntlet shards: $RESULT"
          [ "$RESULT" = success ]
