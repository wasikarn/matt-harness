name: validate-plugin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-plugin:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code@2.1.173

      - name: validate plugin manifest (strict)
        run: claude plugin validate --strict .

  # NOTE: the eval-harness job was removed — it referenced eval/, scripts/evals/,
  # and eval/run-eval.py, all deleted in the c452102 reset. The eval gate is
  # pending rebuild (per CLAUDE.md); re-add a job here when eval/ is restored.
  # The critical-hooks suite is also NOT run in CI. It is ~121s locally but ~20 min
  # on GitHub runners (subprocess-spawn amplification: 8 audit.sh runs + many
  # verification-gate scans + a python3 cold-start per test), too slow + fragile for
  # a recurring job. It is verified by the local pre-commit gate, and Linux-only
  # portability is checked locally with the gnubin + uname-shim simulator (see
  # memory ci-suite-portability). Re-add a job here only if the suite gets fast.
